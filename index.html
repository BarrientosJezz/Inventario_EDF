<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO EDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div id="app" class="max-w-2xl mx-auto"></div>

    <script>
        // URL DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDoFIXzYgU5Y_4iBCbeiaEzzcgZKfYrw5c2zyJ4tk_MioaDa5-wph3H2jeMgjat-O-/exec';

        let estado = {
            paso: 1,
            codigos: [],
            preguntas: [],
            codigoIngresado: '',
            codigoSeleccionado: '',
            clienteSeleccionado: '',
            respuestas: {},
            geolocalizacion: null,
            cargando: false,
            error: '',
            validandoCodigo: false
        };

        // Inicializar aplicación
        async function iniciar() {
            await cargarCodigos();
            obtenerGeolocalizacion();
            renderizar();
        }

        // Cargar códigos
        async function cargarCodigos() {
            try {
                estado.cargando = true;
                renderizar();
                
                const response = await fetch(`${SCRIPT_URL}?action=getCodigos`);
                const data = await response.json();
                
                if (data.error) {
                    estado.error = 'Error al cargar códigos: ' + data.error;
                } else {
                    estado.codigos = data;
                }
            } catch (err) {
                estado.error = 'Error de conexión: ' + err.message;
            } finally {
                estado.cargando = false;
                renderizar();
            }
        }

        // Cargar preguntas
        async function cargarPreguntas() {
            try {
                estado.cargando = true;
                renderizar();
                
                const response = await fetch(`${SCRIPT_URL}?action=getPreguntas`);
                const data = await response.json();
                
                if (data.error) {
                    estado.error = 'Error al cargar preguntas: ' + data.error;
                } else {
                    estado.preguntas = data;
                }
            } catch (err) {
                estado.error = 'Error de conexión: ' + err.message;
            } finally {
                estado.cargando = false;
                renderizar();
            }
        }

        // Obtener geolocalización actualizada (versión async/await)
function obtenerGeolocalizacionActualizada() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            estado.geolocalizacion = { error: 'Geolocalización no disponible' };
            resolve();
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                estado.geolocalizacion = {
                    latitud: position.coords.latitude,
                    longitud: position.coords.longitude,
                    precision: position.coords.accuracy
                };
                console.log('✅ Ubicación actualizada:', estado.geolocalizacion);
                resolve();
            },
            (error) => {
                console.warn('⚠️ Error al actualizar ubicación:', error.message);
                // Mantener la geo anterior si falla
                if (!estado.geolocalizacion) {
                    estado.geolocalizacion = { error: error.message };
                }
                resolve();
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
}

        // Validar código al presionar Enter
        function validarCodigo() {
            estado.error = '';
            
            if (estado.codigoIngresado.trim() === '') {
                estado.error = 'Por favor ingresa un código';
                estado.codigoSeleccionado = '';
                estado.clienteSeleccionado = '';
                renderizar();
                return;
            }
            
            const codigoEncontrado = estado.codigos.find(
                c => c.codigo.toUpperCase() === estado.codigoIngresado.trim()
            );
            
            if (codigoEncontrado) {
                estado.codigoSeleccionado = codigoEncontrado.codigo;
                estado.clienteSeleccionado = codigoEncontrado.cliente;
                estado.error = '';
            } else {
                estado.codigoSeleccionado = '';
                estado.clienteSeleccionado = '';
                estado.error = 'Código no encontrado en la base de datos';
            }
            
            renderizar();
        }

        // Manejar tecla Enter
        function manejarTeclaEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                validarCodigo();
                setTimeout(() => {
                    const input = document.getElementById('codigoInput');
                    if (input) input.focus();
                }, 100);
            }
        }

        // Enfocar input
        function enfocarInput() {
            setTimeout(() => {
                const input = document.getElementById('codigoInput');
                if (input) input.focus();
            }, 100);
        }

        // Avanzar a formulario
        async function avanzarAFormulario() {
            if (!estado.codigoSeleccionado) {
                estado.error = 'Por favor ingresa un código válido';
                renderizar();
                return;
            }
            estado.error = '';
            estado.paso = 2;
            await cargarPreguntas();
        }

        // Actualizar respuesta
        function actualizarRespuesta(preguntaId, valor) {
            estado.respuestas[preguntaId] = valor;
        }

        // Comprimir imagen automáticamente
        function comprimirImagen(file, preguntaId) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Reducir dimensiones si son muy grandes (máximo 1920px)
                        const maxDimension = 1920;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Comprimir con calidad ajustable (0.7 = 70% calidad)
                        const comprimido = canvas.toDataURL('image/jpeg', 0.7);
                        
                        // Verificar tamaño después de comprimir
                        const sizeInMB = (comprimido.length * 0.75) / (1024 * 1024);
                        console.log(`Tamaño después de comprimir: ${sizeInMB.toFixed(2)} MB`);
                        
                        resolve(comprimido);
                    };
                    
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Manejar captura de foto con compresión automática
        async function capturarFoto(preguntaId, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Por favor selecciona un archivo de imagen válido');
                inputElement.value = '';
                return;
            }

            try {
                // Mostrar mensaje de procesamiento
                const preview = document.getElementById(`preview-${preguntaId}`);
                if (preview) {
                    preview.src = '';
                    preview.alt = 'Procesando imagen...';
                    preview.classList.remove('hidden');
                }

                // Comprimir la imagen
                const imagenComprimida = await comprimirImagen(file, preguntaId);
                
                // Guardar en el estado
                estado.respuestas[preguntaId] = imagenComprimida;
                renderizar();
                
            } catch (error) {
                console.error('Error al procesar imagen:', error);
                alert('Error al procesar la imagen. Por favor intenta de nuevo.');
                inputElement.value = '';
            }
        }

        // Eliminar foto capturada
        function eliminarFoto(preguntaId) {
            delete estado.respuestas[preguntaId];
            const input = document.getElementById(`input-foto-${preguntaId}`);
            if (input) input.value = '';
            renderizar();
        }

        // Enviar formulario
        async function enviarFormulario() {
            const preguntasSinResponder = estado.preguntas.filter(p => !estado.respuestas[p.id]);
            if (preguntasSinResponder.length > 0) {
                estado.error = 'Por favor responde todas las preguntas';
                renderizar();
                return;
            }

            estado.cargando = true;
            estado.error = '';
            renderizar();

            try {
                const datos = {
                    codigo: estado.codigoSeleccionado,
                    cliente: estado.clienteSeleccionado,
                    geolocalizacion: estado.geolocalizacion,
                    respuestas: estado.respuestas
                };

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(datos)
                });

                const resultado = await response.json();

                if (resultado.success) {
                    estado.paso = 3;
                } else {
                    estado.error = 'Error al enviar: ' + resultado.error;
                }
            } catch (err) {
                estado.error = 'Error de conexión: ' + err.message;
            } finally {
                estado.cargando = false;
                renderizar();
            }
        }

        // Reiniciar formulario
        function reiniciar() {
            estado = {
                paso: 1,
                codigos: estado.codigos,
                preguntas: [],
                codigoIngresado: '',
                codigoSeleccionado: '',
                clienteSeleccionado: '',
                respuestas: {},
                geolocalizacion: estado.geolocalizacion,
                cargando: false,
                error: '',
                validandoCodigo: false
            };
            renderizar();
        }

        // Renderizar campo según tipo
        function renderizarCampo(pregunta) {
            const valor = estado.respuestas[pregunta.id] || '';

            switch (pregunta.tipo) {
                case 'text':
                    return `<input type="text" value="${valor}" 
                        onchange="actualizarRespuesta(${pregunta.id}, this.value)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        placeholder="Escribe tu respuesta">`;

                case 'textarea':
                    return `<textarea 
                        onchange="actualizarRespuesta(${pregunta.id}, this.value)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        rows="4"
                        placeholder="Escribe tu respuesta">${valor}</textarea>`;

                case 'number':
                    return `<input type="number" value="${valor}"
                        onchange="actualizarRespuesta(${pregunta.id}, this.value)"
                        min="${pregunta.min || 1}" max="${pregunta.max || 10}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">`;

                case 'select':
                    return `<select onchange="actualizarRespuesta(${pregunta.id}, this.value)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Selecciona una opción</option>
                        ${pregunta.opciones.map(op => 
                            `<option value="${op}" ${valor === op ? 'selected' : ''}>${op}</option>`
                        ).join('')}
                    </select>`;

                case 'radio':
                    return `<div class="space-y-2">
                        ${pregunta.opciones.map(op => `
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="pregunta-${pregunta.id}" value="${op}"
                                    ${valor === op ? 'checked' : ''}
                                    onchange="actualizarRespuesta(${pregunta.id}, '${op}')"
                                    class="w-4 h-4 text-blue-600">
                                <span>${op}</span>
                            </label>
                        `).join('')}
                    </div>`;

                case 'foto':
                case 'image':
                case 'camera':
                    return `
                        <div class="space-y-3">
                            <!-- Selector de calidad -->
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-2">
                                <label class="text-xs font-semibold text-blue-800 mb-1 block">
                                    📸 Calidad de la foto:
                                </label>
                                <select id="calidad-${pregunta.id}" 
                                    class="text-sm px-3 py-1.5 border border-blue-300 rounded bg-white focus:ring-2 focus:ring-blue-500">
                                    <option value="0.5">Baja (más ligera, menor calidad)</option>
                                    <option value="0.7" selected>Media (recomendado)</option>
                                    <option value="0.9">Alta (mejor calidad, más pesada)</option>
                                </select>
                            </div>

                            <input type="file" 
                                id="input-foto-${pregunta.id}"
                                accept="image/*" 
                                capture="environment"
                                onchange="capturarFoto(${pregunta.id}, this)"
                                class="block w-full text-sm text-gray-500
                                    file:mr-4 file:py-2 file:px-4
                                    file:rounded-lg file:border-0
                                    file:text-sm file:font-semibold
                                    file:bg-blue-50 file:text-blue-700
                                    hover:file:bg-blue-100 cursor-pointer">
                            
                            ${valor ? `
                                <div class="relative inline-block">
                                    <img id="preview-${pregunta.id}" 
                                        src="${valor}" 
                                        alt="Foto capturada"
                                        class="max-w-full h-48 rounded-lg border-2 border-gray-300 shadow-sm">
                                    <button type="button"
                                        onclick="eliminarFoto(${pregunta.id})"
                                        class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center hover:bg-red-600 shadow-lg">
                                        ✕
                                    </button>
                                </div>
                            ` : `
                                <img id="preview-${pregunta.id}" 
                                    src="" 
                                    alt="Vista previa"
                                    class="hidden max-w-full h-48 rounded-lg border-2 border-gray-300 shadow-sm">
                            `}
                            
                            <!-- Indicador de tamaño -->
                            <p id="size-${pregunta.id}" class="text-xs text-gray-500"></p>
                        </div>`;

                default:
                    return `<p class="text-red-500">Tipo no soportado: ${pregunta.tipo}</p>`;
            }
        }

        // Renderizar aplicación
        function renderizar() {
            const app = document.getElementById('app');
            let html = '';

            if (estado.paso === 1) {
                html = `
                    <div class="bg-white rounded-xl shadow-lg p-8">
                        <h1 class="text-3xl font-bold text-gray-800 mb-6">INVENTARIO EDF</h1>
                        
                        ${estado.cargando ? `
                            <div class="text-center py-4">
                                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                                <p class="mt-4 text-gray-600">Cargando...</p>
                            </div>
                        ` : ''}

                        ${!estado.cargando && estado.codigos.length > 0 ? `
                            <div class="mb-4">
                                <label class="block text-gray-700 font-semibold mb-2">
                                    Ingresa el codigo del cliente:
                                </label>
                                <input 
                                    id="codigoInput"
                                    type="text" 
                                    value="${estado.codigoIngresado}"
                                    oninput="estado.codigoIngresado = this.value.toUpperCase(); this.value = this.value.toUpperCase();"
                                    onkeypress="manejarTeclaEnter(event)"
                                    placeholder="Ejemplo: C0000XXXXX"
                                    class="w-full px-4 py-3 border-2 ${estado.codigoSeleccionado ? 'border-green-400 bg-green-50' : estado.error ? 'border-red-400' : 'border-gray-300'} rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg uppercase"
                                    autocomplete="off"
                                    autofocus>
                                <p class="mt-1 text-xs text-gray-500">
                                    Presiona <kbd class="px-1.5 py-0.5 text-xs font-semibold text-gray-800 bg-gray-100 border border-gray-200 rounded">ENTER</kbd> para validar
                                </p>
                            </div>

                            ${estado.error ? `
                                <div class="bg-red-50 border border-red-300 text-red-700 px-3 py-2 rounded-lg mb-3 flex items-center text-sm">
                                    <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                                    </svg>
                                    <span>${estado.error}</span>
                                </div>
                            ` : ''}

                            ${estado.clienteSeleccionado ? `
                                <div class="bg-green-50 border border-green-300 p-3 rounded-lg mb-4 flex items-center text-sm">
                                    <svg class="w-4 h-4 text-green-600 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    <div>
                                        <span class="text-green-800 font-semibold">Cliente:</span>
                                        <span class="text-green-700 ml-1">${estado.clienteSeleccionado}</span>
                                    </div>
                                </div>
                            ` : ''}

                            ${estado.geolocalizacion && !estado.geolocalizacion.error ? `
                                <div class="bg-blue-50 border border-blue-300 p-2 rounded-lg mb-4 flex items-center text-xs">
                                    <svg class="w-3.5 h-3.5 text-blue-600 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                    <span class="text-blue-700">Ubicación capturada</span>
                                </div>
                            ` : ''}

                            <button onclick="avanzarAFormulario()"
                                ${!estado.codigoSeleccionado ? 'disabled' : ''}
                                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition">
                                Continuar al Formulario
                            </button>
                        ` : ''}
                    </div>
                `;
            } else if (estado.paso === 2) {
                html = `
                    <div class="bg-white rounded-xl shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">
                            Responde las siguientes preguntas
                        </h2>

                        ${estado.error ? `
                            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">
                                ${estado.error}
                            </div>
                        ` : ''}

                        ${estado.cargando ? `
                            <div class="text-center py-4">
                                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                                <p class="mt-4 text-gray-600">Cargando preguntas...</p>
                            </div>
                        ` : ''}

                        ${!estado.cargando && estado.preguntas.length > 0 ? `
                            <div class="space-y-6">
                                ${estado.preguntas.map(p => `
                                    <div class="pb-6 border-b border-gray-200 last:border-b-0">
                                        <label class="block text-gray-700 font-semibold mb-3">
                                            ${p.id}. ${p.pregunta}
                                        </label>
                                        ${renderizarCampo(p)}
                                    </div>
                                `).join('')}

                                <div class="flex gap-4 pt-4">
                                    <button onclick="estado.paso = 1; renderizar()"
                                        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                                        Volver
                                    </button>
                                    <button onclick="enviarFormulario()"
                                        ${estado.cargando ? 'disabled' : ''}
                                        class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300 transition">
                                        ${estado.cargando ? 'Enviando...' : 'Enviar Respuestas'}
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (estado.paso === 3) {
                html = `
                    <div class="bg-white rounded-xl shadow-lg p-8 text-center">
                        <div class="text-green-500 text-6xl mb-4">✓</div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">
                            ¡Gracias por tu respuesta!
                        </h2>
                        <p class="text-gray-600 mb-6">
                            Tu formulario ha sido enviado exitosamente.
                        </p>
                        <button onclick="reiniciar()"
                            class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                            Realizar otra encuesta
                        </button>
                    </div>
                `;
            }

            app.innerHTML = html;
            
            if (estado.paso === 1) {
                enfocarInput();
            }
        }

        // Iniciar cuando cargue la página
        window.onload = iniciar;
    </script>
</body>
</html>
